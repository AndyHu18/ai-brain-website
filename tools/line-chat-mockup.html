<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 280px;
        height: 500px;
        background: #8cabd9;
        font-family: -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
        overflow: hidden;
      }
      /* Header */
      .header {
        background: #06c755;
        color: white;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 52px;
      }
      .header .back {
        font-size: 20px;
      }
      .header .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .header .name {
        font-size: 15px;
        font-weight: 600;
      }

      /* Chat area */
      .chat {
        background: #8cabd9;
        padding: 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: calc(500px - 52px - 48px);
        overflow: hidden;
      }

      /* Date divider */
      .date-divider {
        text-align: center;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
        margin: 4px 0;
      }

      /* Message rows */
      .msg-row {
        display: flex;
        align-items: flex-end;
        gap: 6px;
      }
      .msg-row.sent {
        justify-content: flex-end;
      }
      .msg-row.received {
        justify-content: flex-start;
      }

      .msg-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
      }

      .msg-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-width: 75%;
      }

      .msg-bubble {
        padding: 9px 12px;
        border-radius: 18px;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }
      .msg-row.sent .msg-bubble {
        background: #06c755;
        color: white;
        border-bottom-right-radius: 4px;
      }
      .msg-row.received .msg-bubble {
        background: white;
        color: #333;
        border-bottom-left-radius: 4px;
      }

      .msg-time {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.7);
        flex-shrink: 0;
        align-self: flex-end;
      }
      .msg-row.sent .msg-time {
        order: -1;
      }

      .msg-read {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.6);
        flex-shrink: 0;
        align-self: flex-end;
        text-align: right;
      }
      .msg-row.sent .read-time {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        order: -1;
      }

      /* Input bar */
      .input-bar {
        background: #f7f7f7;
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        gap: 8px;
        border-top: 1px solid #e0e0e0;
      }
      .input-bar .plus {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #bdbdbd;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .input-bar .text-input {
        flex: 1;
        height: 32px;
        border-radius: 16px;
        border: 1px solid #dcdcdc;
        background: white;
        padding: 0 12px;
        font-size: 13px;
      }
      .input-bar .mic {
        font-size: 20px;
        color: #757575;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <span class="back">‹</span>
      <div class="avatar">🤖</div>
      <span class="name">AI 智能客服</span>
    </div>

    <!-- Chat -->
    <div class="chat">
      <div class="date-divider">今天 凌晨 2:47</div>

      <div class="msg-row sent">
        <div class="read-time">
          <span class="msg-read">已讀</span>
          <span class="msg-time">2:47</span>
        </div>
        <div class="msg-content">
          <div class="msg-bubble">半夜了還能下單嗎？</div>
        </div>
      </div>

      <div class="msg-row received">
        <div class="msg-avatar">🤖</div>
        <div class="msg-content">
          <div class="msg-bubble">
            當然可以！我 24 小時在線 😊 請問您想看哪款商品呢？
          </div>
        </div>
        <span class="msg-time">2:47</span>
      </div>

      <div class="msg-row sent">
        <div class="read-time">
          <span class="msg-read">已讀</span>
          <span class="msg-time">2:48</span>
        </div>
        <div class="msg-content">
          <div class="msg-bubble">上次看的那個禮盒組還有嗎</div>
        </div>
      </div>

      <div class="msg-row received">
        <div class="msg-avatar">🤖</div>
        <div class="msg-content">
          <div class="msg-bubble">
            有的！經典禮盒組目前庫存充足，需要幫您直接下單嗎？
          </div>
        </div>
        <span class="msg-time">2:48</span>
      </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
      <div class="plus">+</div>
      <div class="text-input"></div>
      <span class="mic">🎤</span>
    </div>
  </body>
</html>
